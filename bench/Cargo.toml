# Benchmarks for Perex. A separate package, so the published crate carries no
# dependencies at all and this can depend on whatever a comparison needs.
[package]
name = "perex-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
perex = { path = ".." }
# Comparators, development-only. `regress` is another ECMAScript engine;
# `regex` is a linear-time automaton and answers a different question, which
# the README says where it is reported.
regress = { version = "0.11.1", features = ["utf16"] }
regex = "1.13"
fancy-regex = "0.18"
libc = "0.2"

[[bin]]
name = "perex-bench"
path = "src/main.rs"

[[bin]]
name = "perex-native"
path = "src/bin/native.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
