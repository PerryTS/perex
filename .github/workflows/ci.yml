name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --locked --all-targets
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable test --locked --release
      - run: python3 tools/generate-casefold.py --check
      - run: python3 tools/generate-properties.py --check

  input-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked --release --example input_probe
      - run: node tools/check-input.mjs target/release/examples/input_probe
      - run: cargo +stable build --locked --release --example engine_probe
      - name: Partial engine differential with exact documented omissions
        run: node tools/check-engine.mjs target/release/examples/engine_probe --allow-listed-unsupported --allow-reviewed-reference-disagreements
      - name: Paused execution with relocation and scratch growth
        shell: bash
        run: |
          for quantum in 1 17; do
            probe="$RUNNER_TEMP/perex-resumed-$quantum"
            printf '#!/bin/sh\nexec "%s" --quantum %s --relocate --grow "$@"\n' "$PWD/target/release/examples/engine_probe" "$quantum" > "$probe"
            chmod +x "$probe"
            node tools/check-engine.mjs "$probe" --allow-listed-unsupported --allow-reviewed-reference-disagreements --output "artifacts/resumed-$quantum"
          done
      - name: Named captures, Unicode identifiers and duplicate alternatives
        run: node tools/check-names.mjs target/release/examples/engine_probe
      - name: Legacy numeric escapes, control prefixes and quantified lookahead
        run: node tools/check-legacy.mjs target/release/examples/engine_probe
      - name: Required-text admission on long borrowed subjects
        run: node tools/check-admission.mjs target/release/examples/engine_probe
      - name: Nested repetition ordering and complete captures
        run: node tools/check-repetition.mjs target/release/examples/engine_probe
      - name: Lexical flags, nested scopes and complete captures
        run: node tools/check-modifiers.mjs target/release/examples/engine_probe
      - name: Candidate starts, complete captures and relocation
        run: |
          node tools/check-candidate.mjs target/release/examples/engine_probe artifacts/candidate
          node tools/check-candidate.mjs target/release/examples/engine_probe artifacts/candidate-q1 --quantum 1 --relocate --grow
          node tools/check-candidate.mjs target/release/examples/engine_probe artifacts/candidate-q17 --quantum 17 --relocate --grow
      - name: Forward-admission bound, complete captures and relocation
        run: |
          node tools/check-bound.mjs target/release/examples/engine_probe artifacts/bound
          node tools/check-bound.mjs target/release/examples/engine_probe artifacts/bound-q1 --quantum 1 --relocate --grow
          node tools/check-bound.mjs target/release/examples/engine_probe artifacts/bound-q17 --quantum 17 --relocate --grow
      - name: Strict end conditions, complete captures and relocation
        run: |
          node tools/check-end-candidate.mjs target/release/examples/engine_probe artifacts/end-candidate
          node tools/check-end-candidate.mjs target/release/examples/engine_probe artifacts/end-candidate-q1 --quantum 1 --relocate --grow
          node tools/check-end-candidate.mjs target/release/examples/engine_probe artifacts/end-candidate-q17 --quantum 17 --relocate --grow
      - name: Large classes, complete captures and relocation
        run: |
          node tools/check-classes.mjs target/release/examples/engine_probe artifacts/classes
          node tools/check-classes.mjs target/release/examples/engine_probe artifacts/classes-q1 --quantum 1 --relocate --grow
          node tools/check-classes.mjs target/release/examples/engine_probe artifacts/classes-q17 --quantum 17 --relocate --grow
      - name: Unicode-sets flag, complete captures and relocation
        run: |
          node tools/check-unicode-sets.mjs target/release/examples/engine_probe artifacts/unicode-sets
          node tools/check-unicode-sets.mjs target/release/examples/engine_probe artifacts/unicode-sets-q1 --quantum 1 --relocate --grow
          node tools/check-unicode-sets.mjs target/release/examples/engine_probe artifacts/unicode-sets-q17 --quantum 17 --relocate --grow
      - name: Test262 pattern corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tc39/test262
          ref: 4249661388e5d3f92a85186213da140a6481490f
          path: third_party/test262-checkout
      - name: Test262 pattern syntax and matching differential
        run: node tools/check-test262.mjs target/release/examples/engine_probe third_party/test262-checkout artifacts/test262 --work 64000000
      - name: Unicode and legacy case equivalence differential
        run: node tools/check-casefold.mjs target/release/examples/engine_probe
      - run: cargo +stable build --locked --release --example property_probe
      - name: Exhaustive properties and exact reviewed reference disagreements
        run: node tools/check-properties.mjs target/release/examples/property_probe target/release/examples/engine_probe --allow-reviewed-reference-disagreements

  semantic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.1
      - run: node tools/reference.mjs --check
      - run: node --test tools/reference.test.mjs
